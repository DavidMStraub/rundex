[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rundex"
dynamic = ["version"]
description = "Running and decoupling of the strong coupling and quark masses (JAX port of rundex)"
requires-python = ">=3.10"
authors = [
  {name = "David Straub", email = "straub@protonmail.com"},
]
readme = "README.md"
dependencies = [
    "jax>=0.4",
    "diffrax>=0.4",
    "jaxtyping",
]

[project.optional-dependencies]
test = [
  "pytest",
  "mypy",
  "ruff",
  "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["benchmarks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E741",  # ambiguous variable name (l, O, I) — physics code uses 'l' for loops
    "F722",   # jaxtyping multi-dimensional shapes trigger F722; safe to disable globally
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # lambda assignments are idiomatic in pytest parametrize helpers
"src/rundex/_masses.py" = ["E501"]  # long lines in physics formulas

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
exclude = ["benchmarks"]

[[tool.mypy.overrides]]
module = "rundex.*"
disallow_untyped_defs = true
